name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Validate release commit
        run: |
          go test -race ./...
          go vet ./...

      - name: Verify offline universal deployment choices
        run: |
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o /tmp/quikdb-frame ./cmd/quikdb-frame
          fixture="$GITHUB_WORKSPACE/internal/convert/testdata/express-static"
          /tmp/quikdb-frame deploy --source "$fixture" --config contracts/deployment-manifest-v1.example.json --name published-as-is --mode as-is --dry-run --json > /tmp/as-is-plan.json
          /tmp/quikdb-frame deploy --source "$fixture" --name published-frame --mode frame --from express --dry-run --json > /tmp/frame-plan.json
          node -e 'const p=require("/tmp/as-is-plan.json");if(p.mode!=="as-is"||p.source!=="local archive"||p.applicationName!=="published-as-is"||!p.sha256||p.entries<1)process.exit(1)'
          node -e 'const p=require("/tmp/frame-plan.json");if(p.mode!=="frame"||p.qualification!=="eligible"||p.converter!=="express-static-v1"||p.applicationName!=="published-frame"||p.rollback?.mode!=="as-is")process.exit(1)'

      - name: Build binaries
        run: |
          sh scripts/install_test.sh
          mkdir -p dist
          cp scripts/install.sh dist/install.sh
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-linux-amd64   ./cmd/quikdb-frame
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-linux-arm64   ./cmd/quikdb-frame
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-darwin-amd64  ./cmd/quikdb-frame
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-darwin-arm64  ./cmd/quikdb-frame
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-windows-amd64.exe ./cmd/quikdb-frame

          ls -lh dist/

      - name: Verify binaries and record checksums
        run: |
          dist/quikdb-frame-linux-amd64 version
          cd dist
          sha256sum quikdb-frame-* install.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf 'Release commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Sign build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/quikdb-frame-*
            dist/install.sh

      - name: Verify signed provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          FRAME_PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for binary in dist/quikdb-frame-* dist/install.sh; do
            gh attestation verify "$binary" --repo quikdb/quikdb-frame \
              --signer-workflow quikdb/quikdb-frame/.github/workflows/release.yml \
              --source-digest "$GITHUB_SHA" --bundle "$FRAME_PROVENANCE_BUNDLE"
          done
          cp "$FRAME_PROVENANCE_BUNDLE" dist/provenance.sigstore.jsonl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download your platform binary and SHA256SUMS from this same tagged release.
            Verify the binary checksum before installing it on your PATH.

            This release also publishes signed build provenance. With GitHub CLI:
            ```text
            gh attestation verify <downloaded-binary> --repo quikdb/quikdb-frame --signer-workflow quikdb/quikdb-frame/.github/workflows/release.yml
            ```
            The provenance.sigstore.jsonl asset can also be supplied with --bundle.
            CLI upgrade verifies checksums; automatic in-CLI provenance verification remains planned.

            Connect through Compute with `quikdb-frame login`, or `quikdb-frame login --device`
            for a remote terminal. Approve only a login you started. See README for credential
            storage, session expiry and current deployment/conversion support.

            v0.1.16 makes local as-is packaging dry-runs and the bounded Express-to-Frame
            qualification/dry-run available in published binaries. Actual local archive upload
            remains unavailable until Compute advertises the complete archive capability; this
            release does not enable any API or runner flag.
