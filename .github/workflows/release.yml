name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Validate release commit
        run: |
          go test -race ./...
          go vet ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-linux-amd64   ./cmd/quikdb-frame
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-linux-arm64   ./cmd/quikdb-frame
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-darwin-amd64  ./cmd/quikdb-frame
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-darwin-arm64  ./cmd/quikdb-frame
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/quikdb-frame-windows-amd64.exe ./cmd/quikdb-frame

          ls -lh dist/

      - name: Verify binaries and record checksums
        run: |
          dist/quikdb-frame-linux-amd64 version
          cd dist
          sha256sum quikdb-frame-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf 'Release commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/quikdb/quikdb-frame/releases/latest/download/quikdb-frame-darwin-arm64 -o /usr/local/bin/quikdb-frame
            chmod +x /usr/local/bin/quikdb-frame
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/quikdb/quikdb-frame/releases/latest/download/quikdb-frame-darwin-amd64 -o /usr/local/bin/quikdb-frame
            chmod +x /usr/local/bin/quikdb-frame
            ```

            **Linux**
            ```bash
            curl -L https://github.com/quikdb/quikdb-frame/releases/latest/download/quikdb-frame-linux-amd64 -o /usr/local/bin/quikdb-frame
            chmod +x /usr/local/bin/quikdb-frame
            ```

            **Windows (PowerShell)**
            ```powershell
            Invoke-WebRequest -Uri https://github.com/quikdb/quikdb-frame/releases/latest/download/quikdb-frame-windows-amd64.exe -OutFile quikdb-frame.exe
            Move-Item quikdb-frame.exe $env:USERPROFILE\quikdb-frame.exe
            ```
