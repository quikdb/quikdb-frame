name: Native CLI Auth Validation
on:
  push:
    branches: [feat/frame-native-auth]
  pull_request:
    paths:
      - internal/deploy/**
      - go.mod
      - go.sum
      - cmd/quikdb-frame/**
      - .github/workflows/native-auth.yml
permissions:
  contents: read
concurrency:
  group: frame-native-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Verify dependency lockfiles
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test credentials and callbacks
        run: |
          go test -race ./...
          go vet ./...
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${platform%/*} GOARCH=${platform#*/} go build -o /tmp/frame-auth-build ./cmd/quikdb-frame
          done
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  desktop-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FRAME_KEYRING_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Create disposable macOS keychain
        if: runner.os == 'macOS'
        run: |
          fixture_keychain_path="$RUNNER_TEMP/quikdb-frame-validation.keychain-db"
          security create-keychain -p fixture-keychain-password "$fixture_keychain_path"
          security unlock-keychain -p fixture-keychain-password "$fixture_keychain_path"
          security default-keychain -s "$fixture_keychain_path"
      - run: go test ./internal/deploy ./internal/upgrade
      - name: Remove disposable macOS keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/quikdb-frame-validation.keychain-db"
